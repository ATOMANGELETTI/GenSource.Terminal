[[permission]]
identifier = "allow-app-commands"
description = "Custom GenSource Terminal IPC commands (settings, window, quit)."
commands.allow = [
  "greet",
  "get_app_info",
  "get_settings",
  "reload_settings",
  "get_keybindings",
  "open_configs_folder",
  "hide_main_window",
  "request_quit",
  "quit_app",
  "pty_create",
  "pty_write",
  "pty_resize",
  "pty_kill",
]
