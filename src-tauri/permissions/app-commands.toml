[[permission]]
identifier = "allow-app-commands"
description = "Custom GenSource Terminal IPC commands (settings, window, quit)."
commands.allow = [
  "greet",
  "get_app_info",
  "get_settings",
  "get_logging",
  "reload_settings",
  "save_settings",
  "save_logging",
  "save_keybindings",
  "get_keybindings",
  "open_configs_folder",
  "hide_main_window",
  "request_quit",
  "quit_app",
  "pty_create",
  "pty_write",
  "pty_resize",
  "pty_kill",
  "fs_list_drives",
  "fs_list_dir",
  "fs_create_file",
  "fs_create_dir",
  "fs_rename",
  "fs_remove",
  "fs_entry_info",
  "fs_open_path",
  "fs_reveal_path",
  "fs_username",
  "get_system_metrics",
  "git_open_folder",
  "git_init",
  "git_status",
  "git_stage",
  "git_unstage",
  "git_discard",
  "git_commit",
  "git_branches",
  "git_checkout",
  "git_create_branch",
  "git_watch_start",
  "git_watch_stop",
  "get_agent_config",
  "save_agent_config",
  "agent_has_api_key",
  "agent_chat_send",
  "agent_chat_cancel",
  "agent_chat_clear",
  "agent_confirm_response",
]
