[[permission]]
identifier = "allow-app-commands"
description = "Custom GenSource Terminal IPC commands (settings, window, quit)."
commands.allow = [
  "greet",
  "get_app_info",
  "get_settings",
  "reload_settings",
  "get_keybindings",
  "open_configs_folder",
  "hide_main_window",
  "request_quit",
  "quit_app",
  "pty_create",
  "pty_write",
  "pty_resize",
  "pty_kill",
  "fs_list_drives",
  "fs_list_dir",
  "fs_create_file",
  "fs_create_dir",
  "fs_rename",
  "fs_remove",
  "fs_entry_info",
  "fs_open_path",
  "fs_reveal_path",
  "fs_username",
  "get_system_metrics",
]
